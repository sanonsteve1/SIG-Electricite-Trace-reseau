<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Coupure / interrupteur : rectangle avec ouverture (symbole IEC 60617) -->
  <circle cx="16" cy="16" r="15" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <!-- Barre gauche -->
  <line x1="5" y1="16" x2="12" y2="16" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Levier ouvert (45�) -->
  <line x1="12" y1="16" x2="20" y2="8" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Barre droite -->
  <line x1="20" y1="16" x2="27" y2="16" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Points de contact -->
  <circle cx="12" cy="16" r="2" fill="#ef4444"/>
  <circle cx="20" cy="16" r="2" fill="#ef4444"/>
</svg>
